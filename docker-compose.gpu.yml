services:
  nimbus-mask:
    environment:
      NIMBUS_CLOUDMASK_DEVICE: ${NIMBUS_CLOUDMASK_DEVICE:-cuda}
      NIMBUS_WATERMASK_DEVICE: ${NIMBUS_WATERMASK_DEVICE:-cuda}
      NIMBUS_CLOUDMASK_TILE_WORKERS: ${NIMBUS_CLOUDMASK_TILE_WORKERS:-1}
      NIMBUS_WATERMASK_TILE_WORKERS: ${NIMBUS_WATERMASK_TILE_WORKERS:-1}
      NIMBUS_CLOUDMASK_BATCH_SIZE: ${NIMBUS_CLOUDMASK_BATCH_SIZE:-2}
      NIMBUS_WATERMASK_BATCH_SIZE: ${NIMBUS_WATERMASK_BATCH_SIZE:-2}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    gpus: all
    shm_size: ${NIMBUS_MASK_SHM_SIZE:-8g}
